<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.line {
  width: 0;
  overflow: hidden;
  white-space: nowrap;
  /* border-right: 2px solid black; */
}

.line:nth-child(1) {
  animation: typing 2s steps(14) forwards;
}

.line:nth-child(2) {
  animation: typing 2s steps(14) forwards;
  animation-delay: 2s;
}

.line:nth-child(3) {
  animation: typing 2s steps(22) forwards;
  animation-delay: 4s;
}

.line:nth-child(4) {
  animation: typing 2s steps(22) forwards;
  animation-delay: 6s;
}

@keyframes typing {
  to {
    width: 100%;
  }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes hide {
  to { opacity: 0; }
}
</style>
<body>
<div class="container">
  <p class="line">Hello World</p>
  <p class="line">This is CSS typing effect</p>
  <p class="line">Support multiple lines</p>
  <p class="line">Pure CSS animation</p>
</div>
<script>
</script>
</body>
</html>
